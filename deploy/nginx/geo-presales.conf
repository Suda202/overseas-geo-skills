# GEO 平台三服务统一入口
# 部署：cp geo-presales.conf /etc/nginx/conf.d/  然后 nginx -t && systemctl reload nginx
# 域名未就绪时把 server_name 改成 _ ，用 http://<公网IP>/ 访问

# ---- 令牌校验：/api/ 下的服务要求 Authorization: Bearer $GEO_ACCESS_TOKEN ----
# install.sh 会把 __GEO_ACCESS_TOKEN__ 替换成 /etc/geo-presales/env 里的真实值（密钥不入库）
map $http_authorization $geo_api_authorized {
    default                          0;
    "Bearer __GEO_ACCESS_TOKEN__" 1;
}

upstream geo_orchestrator { server 127.0.0.1:8080; keepalive 16; }
upstream geo_server       { server 127.0.0.1:8090; keepalive 16; }
upstream geo_search       { server 127.0.0.1:9998; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name geo.example.com;      # TODO 改成你的域名或 _

    client_max_body_size 20m;
    access_log /var/log/nginx/geo-presales.access.log;
    error_log  /var/log/nginx/geo-presales.error.log warn;

    # ---------- 公共健康检查（无需鉴权，供探针/你自己确认存活）----------
    location = /healthz            { proxy_pass http://geo_orchestrator; }
    location = /api/v1/health      { proxy_pass http://geo_server; }
    location = /api/v1/search-health { proxy_pass http://geo_search/api/v1/health; }

    # ---------- 编排器 Web UI（表单/结果页，浏览器无法带自定义头 → Basic 认证）----------
    # htpasswd 生成：sudo htpasswd -c /etc/nginx/geo-users.conf <用户名>
    location / {
        auth_basic           "GEO Orchestrator";
        auth_basic_user_file /etc/nginx/geo-users.conf;
        # Dify blocking 调用最长 DIFY_TIMEOUT=300s
        proxy_read_timeout   360s;
        proxy_send_timeout   360s;
        proxy_pass           http://geo_orchestrator;
        proxy_http_version   1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    # ---------- search_server：web_search / web_fetch ----------
    location ~ ^/api/v1/web_(search|fetch)(_batch)?$ {
        if ($geo_api_authorized = 0) { return 401; }
        # 批量抓取耗时较长
        proxy_read_timeout 900s;
        proxy_pass http://geo_search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- server.py：34 个技能工具统一入口 ----------
    location ~ ^/api/v1/(invoke|invoke_gzip|tools|tools/detail)$ {
        if ($geo_api_authorized = 0) { return 401; }
        # collect_answers 内部超时 3600s，网关必须更长才不会中断长任务
        proxy_read_timeout 3900s;
        proxy_send_timeout 3900s;
        proxy_request_buffering on;
        proxy_pass http://geo_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ { return 404; }
}
