interface:
  display_name: "GEO 售前评测集 Case 生成器"
  short_description: "Discovery-first 生成售前诊断 Case、主题与客户确认文档"
  default_prompt: "Use $geo-presales-eval-case-builder to research public buyer demand first, then create or update product-line-specific Cases as Records in the configured Feishu Base, without Case sequence numbers. Split different product lines into separate Cases. For each Case, generate one core-category Coverage Topic plus two distinct same-product-line buying-scenario Depth Topics by default; use one Depth Topic when evidence is insufficient, and never exceed three Topics or invent topics to meet a quota. Every retained Topic must support at least five distinct discovery-stage buyer intents; otherwise merge it or record the evidence gap. Case does not allocate question or Attribute quotas; downstream Discovery requires at least five Prompts per Topic and at most fifty Prompts per presales batch, while competitor evaluation is added later without a fixed quota. Prefill a Feishu customer confirmation/completion document with evidence, hypotheses, pending confirmations, ICP/persona or audience, execution markets/languages, priorities, differentiators, boundaries, unique assets, proposed Topics, real buyer intents, and requested internal sales/support/win-loss/GSC evidence. Preserve existing document identity and confirmed answers on updates; keep Topic-only updates scoped to related sections. If fewer than three confirmed competitor name-domain pairs are supplied, invoke $overseas-geo-competitor-research, including from-scratch discovery when none are supplied, then write its three frozen formal competitors back into the Record."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic"]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
