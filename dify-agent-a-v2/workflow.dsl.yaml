    - data:
        code: "def main(official_domain, competitors_parsed, search_api_base, geo_api_token):\n\
          \    \"\"\"Single batch fetch with strict <55s budget to fit Dify sandbox\
          \ timeout.\n    Failed URLs are left empty — downstream LLM falls back to\
          \ search_results.\"\"\"\n    headers = {\"Authorization\": f\"Bearer {geo_api_token}\"\
          }\n    import requests\n\n    endpoint = f\"{search_api_base}/api/v1/web_fetch_batch\"\
          \n    urls = []\n    target = official_domain if official_domain.startswith(\"\
          http\") else f\"https://{official_domain}\"\n    urls.append(target)\n \
          \   for c in competitors_parsed[:3]:\n        d = c.get(\"official_domain\"\
          , \"\")\n        if d:\n            urls.append(d if d.startswith(\"http\"\
          ) else f\"https://{d}\")\n    urls = urls[:4]\n\n    slots = [{\"url\":\
          \ u, \"content\": \"\", \"error\": \"pending\"} for u in urls]\n\n    try:\n\
          \        resp = requests.post(\n            endpoint,\n            json={\"\
          urls\": \"\\n\".join(urls), \"max_chars_per_url\": 3000},\n            headers=headers,\n\
          \            timeout=50  # must fit under sandbox 60s limit\n        )\n\
          \        result = resp.json()\n        if result.get(\"ok\"):\n        \
          \    for i, r in enumerate(result.get(\"data\", {}).get(\"results\", [])):\n\
          \                if i >= len(slots):\n                    break\n      \
          \          content = r.get(\"content\", \"\") or r.get(\"markdown\", \"\"\
          ) or \"\"\n                if content:\n                    slots[i] = {\"\
          url\": slots[i][\"url\"], \"content\": content, \"error\": \"\"}\n     \
          \           else:\n                    slots[i][\"error\"] = r.get(\"error\"\
          , \"empty\")[:150]\n        else:\n            for s in slots:\n       \
          \         s[\"error\"] = result.get(\"error\", \"batch failed\")[:150]\n\
          \    except Exception as e:\n        for s in slots:\n            s[\"error\"\
          ] = f\"{type(e).__name__}: {str(e)[:100]}\"\n\n    succeeded = sum(1 for\
          \ s in slots if s[\"content\"])\n    failed_urls = [s[\"url\"] for s in\
          \ slots if not s[\"content\"]]\n    error_summary = \"\"\n    if failed_urls:\n\
          \        error_summary = f\"Partial fetch: {len(failed_urls)}/{len(urls)}\
          \ failed; downstream uses search_results fallback\"\n\n    return {\n  \
          \      \"ok\": succeeded > 0,\n        \"fetch_results\": slots,\n     \
          \   \"succeeded_count\": succeeded,\n        \"failed_urls\": failed_urls,\n\
          \        \"error\": error_summary\n    }"
