    - data:
        code: "import requests\nimport json\nimport time\n\ndef main(brand_name, official_domain,\
          \ topics, regions, competitors, biz_api_base, geo_api_token):\n    headers\
          \ = {\"Authorization\": f\"Bearer {geo_api_token}\"}\n    url = f\"{biz_api_base}/api/v1/tools/competitor_research_prepare\"\
          \n    competitors_list = []\n    try:\n        parsed = json.loads(competitors)\
          \ if isinstance(competitors, str) else competitors\n        if isinstance(parsed,\
          \ list):\n            for c in parsed:\n                if isinstance(c,\
          \ dict):\n                    name = c.get(\"name\") or c.get(\"名称\", \"\
          \")\n                    domain = c.get(\"official_domain\") or c.get(\"\
          官网域名\") or c.get(\"domain\", \"\")\n                    domain = domain.replace(\"\
          https://\", \"\").replace(\"http://\", \"\").strip(\"/\")\n            \
          \        competitors_list.append({\"name\": name, \"official_domain\": domain})\n\
          \    except Exception:\n        for name in str(competitors).split(\",\"\
          ):\n            name = name.strip()\n            if name:\n            \
          \    competitors_list.append({\"name\": name, \"official_domain\": \"\"\
          })\n    clean_domain = official_domain.replace(\"https://\", \"\").replace(\"\
          http://\", \"\").strip(\"/\")\n    payload = {\n        \"input\": {\"target\"\
          : {\"name\": brand_name, \"official_domain\": clean_domain}, \"topic\":\
          \ topics, \"market\": regions, \"known_competitors\": competitors_list[:3]},\n\
          \        \"run_dir\": f\"/tmp/geo-{brand_name}/competitor-research\",\n\
          \        \"overwrite\": True\n    }\n    last_error = \"\"\n    for attempt\
          \ in range(3):\n        try:\n            resp = requests.post(url, json=payload,\
          \ headers=headers, timeout=60)\n            result = resp.json()\n     \
          \       if not result.get(\"ok\"):\n                return {\"ok\": False,\
          \ \"error\": result.get(\"error\", \"unknown\"), \"run_dir\": \"\", \"competitors_parsed\"\
          : []}\n            data = result[\"data\"]\n            stdout_str = data.get(\"\
          stdout\", \"{}\")\n            try:\n                stdout_data = json.loads(stdout_str)\n\
          \                run_dir = stdout_data.get(\"run_dir\", \"\")\n        \
          \    except json.JSONDecodeError:\n                run_dir = \"\"\n    \
          \        if not run_dir:\n                return {\"ok\": False, \"error\"\
          : \"服务端返回的 stdout 里没有 run_dir\", \"run_dir\": \"\", \"competitors_parsed\"\
          : []}\n            return {\"ok\": True, \"run_dir\": run_dir, \"competitors_parsed\"\
          : competitors_list[:3], \"error\": \"\"}\n        except (requests.exceptions.Timeout,\
          \ requests.exceptions.ConnectionError) as e:\n            last_error = f\"\
          attempt {attempt+1}/3: {type(e).__name__}: {e}\"\n            if attempt\
          \ < 2:\n                time.sleep(2 ** attempt)\n        except Exception\
          \ as e:\n            return {\"ok\": False, \"error\": f\"{type(e).__name__}:\
          \ {e}\", \"run_dir\": \"\", \"competitors_parsed\": []}\n    return {\"\
          ok\": False, \"error\": f\"重试 3 次仍失败: {last_error}\", \"run_dir\": \"\"\
          , \"competitors_parsed\": []}"
        code_language: python3
        desc: 冻结竞品研究输入，从 stdout 解析 run_dir
        outputs:
