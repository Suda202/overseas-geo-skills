          ) or {}\n    if not isinstance(case_fields, dict):\n        case_fields\
          \ = {}\n\n    def norm_key(s):\n        return re.sub(r\"[\\W_]+\", \" \"\
          , str(s or \"\").casefold(), flags=re.UNICODE).strip()\n\n    def normalize_str(s):\n\
          \        if not isinstance(s, str):\n            return s\n        return\
