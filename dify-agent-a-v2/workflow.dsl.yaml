          : topics,\n                \"competitors\": competitors_en,\n          \
          \      \"supplemental\": supplemental or \"\",\n                \"target_customers\"\
          : [],\n                \"pain_points\": [],\n                \"use_cases\"\
          : [],\n                \"product_features\": [],\n                \"differentiation\"\
          : \"\",\n                \"applicable_boundary\": \"\"\n            },\n\
          \            \"options\": {\"locale\": \"en\", \"generation_stage\": \"\
          discovery\"}\n        }\n    }\n    last_error = \"\"\n    for attempt in\
          \ range(3):\n        try:\n            resp = requests.post(url, json=payload,\
