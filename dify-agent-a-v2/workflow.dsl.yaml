          \    bank_input[\"attribute_plan\"] = attribute_plan\n    bank_input[\"\
          questions\"] = questions\n    return {\"ok\": True, \"bank_input\": bank_input,\
          \ \"fixes_applied\": fixes, \"error\": \"\"}"
