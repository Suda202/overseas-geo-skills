          \                return {\"ok\": False, \"error\": f\"normalize_case validation\
          \ failed: {error_msg}\", \"normalized\": {}}\n            return {\"ok\"\
          : True, \"normalized\": data.get(\"normalized\", {}), \"error\": \"\"}\n\
