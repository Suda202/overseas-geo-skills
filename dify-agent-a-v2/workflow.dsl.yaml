          \ dict):\n            continue\n        priorities = plan.get(\"priorities\"\
          ) or {}\n        if not isinstance(priorities, dict):\n            priorities\
          \ = {}\n            plan[\"priorities\"] = priorities\n\n        # Dedup\
          \ attributes across P1/P2/P3: keep first occurrence (P1 wins).\n       \
          \ seen_attr_keys = set()\n        for priority_level in [\"P1\", \"P2\"\
          , \"P3\"]:\n            items = priorities.get(priority_level) or []\n \
          \           if not isinstance(items, list):\n                priorities[priority_level]\
          \ = []\n                continue\n            kept = []\n            for\
          \ item in items:\n                if not isinstance(item, dict):\n     \
          \               continue\n                if priority_level in (\"P2\",\
          \ \"P3\") and \"verification_statement\" in item:\n                    del\
          \ item[\"verification_statement\"]\n                    fixes.append(f\"\
          strip verification_statement from {priority_level}\")\n                attr\
          \ = (item.get(\"attribute\") or \"\").strip()\n                key = norm_key(attr)\n\
          \                if key and key in seen_attr_keys:\n                   \
          \ fixes.append(f\"drop duplicate attribute in {priority_level}: {attr}\"\
          )\n                    continue\n                if key:\n             \
          \       seen_attr_keys.add(key)\n                sf = item.get(\"source_field\"\
          ) or \"\"\n                sv = item.get(\"source_value\") or \"\"\n   \
          \             if sf and sf in case_fields:\n                    actual =\
          \ case_fields[sf]\n                    if normalize_str(sv) != normalize_str(actual):\n\
          \                        fixes.append(f\"fix source_value: {sf}\")\n   \
          \                     item[\"source_value\"] = actual\n                kept.append(item)\n\
          \            priorities[priority_level] = kept\n\n    questions = bank_input.get(\"\
          questions\") or []\n    if not isinstance(questions, list):\n        questions\
          \ = []\n    q_count = len(questions)\n    config_meta = bank_input.get(\"\
          config_meta\") or {}\n    if not isinstance(config_meta, dict):\n      \
          \  config_meta = {}\n    if config_meta.get(\"expected_total\") != q_count:\n\
          \        fixes.append(f\"expected_total: {config_meta.get('expected_total')}\
          \ -> {q_count}\")\n        config_meta[\"expected_total\"] = q_count\n\n\
          \    quotas = config_meta.get(\"quotas\") or {}\n    if not isinstance(quotas,\
          \ dict):\n        quotas = {}\n    intent_counts = {}\n    for q in questions:\n\
          \        if not isinstance(q, dict):\n            continue\n        tags\
          \ = q.get(\"tags\") or []\n        if not isinstance(tags, list):\n    \
          \        continue\n        for tag in tags:\n            if isinstance(tag,\
          \ str) and tag.startswith(\"Intent: \"):\n                intent_counts[tag]\
          \ = intent_counts.get(tag, 0) + 1\n    all_intents = [\"Intent: Discovery\"\
          , \"Intent: Competitor\", \"Intent: Verification\", \"Intent: Accuracy\"\
          , \"Intent: Evaluation\", \"Intent: Category Awareness\"]\n    new_intent_tags\
          \ = {i: intent_counts.get(i, 0) for i in all_intents}\n    quotas[\"intent_tags\"\
          ] = new_intent_tags\n    quotas[\"per_topic\"] = new_intent_tags.copy()\n\
          \    quotas[\"topic_overrides\"] = {}\n    config_meta[\"quotas\"] = quotas\n\
          \    config_meta.setdefault(\"generation_stage\", \"discovery\")\n    config_meta.setdefault(\"\
          locale\", \"en\")\n\n    # Align \"Attribute: X\" tags to attribute_plan\
          \ canonical strings\n    canonical_attrs = []\n    for plan in attribute_plan:\n\
          \        if not isinstance(plan, dict):\n            continue\n        pri\
          \ = plan.get(\"priorities\") or {}\n        for lvl in [\"P1\", \"P2\",\
          \ \"P3\"]:\n            for entry in (pri.get(lvl) or []):\n           \
          \     if isinstance(entry, dict):\n                    a = (entry.get(\"\
          attribute\") or \"\").strip()\n                    if a:\n             \
          \           canonical_attrs.append(a)\n\n    norm_to_canonical = {}\n  \
          \  for a in canonical_attrs:\n        norm_to_canonical[norm_key(a)] = a\n\
          \n    for q in questions:\n        if not isinstance(q, dict):\n       \
          \     continue\n        tags = q.get(\"tags\")\n        if not isinstance(tags,\
          \ list):\n            continue\n        new_tags = []\n        for tag in\
          \ tags:\n            if isinstance(tag, str) and tag.startswith(\"Attribute:\
          \ \"):\n                label = tag[len(\"Attribute: \"):].strip()\n   \
          \             if label in canonical_attrs:\n                    new_tags.append(tag)\n\
          \                    continue\n                nk = norm_key(label)\n  \
          \              if nk in norm_to_canonical:\n                    canonical\
          \ = norm_to_canonical[nk]\n                    new_tags.append(f\"Attribute:\
          \ {canonical}\")\n                    fixes.append(f\"align tag: '{label}'\
