    - data:
        code: "import requests\nimport time\n\ndef main(brand_name, topics, regions,\
          \ competitors_parsed, search_api_base, geo_api_token):\n    headers = {\"\
          Authorization\": f\"Bearer {geo_api_token}\"}\n    url = f\"{search_api_base}/api/v1/web_search_batch\"\
          \n    comp_names = [c[\"name\"] for c in competitors_parsed if c.get(\"\
          name\")]\n    comp_names_str = \" \".join(f'\"{n}\"' for n in comp_names[:3])\n\
          \    queries = [\n        f\"{brand_name} {comp_names_str} comparison alternatives\"\
          .strip(),\n        f\"best {topics} brands {regions} 2026\",\n        f\"\
          {topics} market report {regions} competitive landscape\",\n        f\"top\
          \ {topics} brands review {regions} 2026\"\n    ]\n    payload = {\"queries\"\
          : \"\\n\".join(queries), \"max_results_per_query\": 5}\n    last_error =\
          \ \"\"\n    for attempt in range(5):\n        try:\n            resp = requests.post(url,\
          \ json=payload, headers=headers, timeout=90)\n            result = resp.json()\n\
          \            if not result.get(\"ok\"):\n                last_error = result.get(\"\
          error\", \"unknown\")\n                err_str = str(last_error)\n     \
          \           if \"400\" in err_str or \"401\" in err_str or \"403\" in err_str:\n\
          \                    return {\"ok\": False, \"error\": last_error, \"search_results\"\
          : []}\n                if attempt < 4:\n                    time.sleep(min(2\
          \ ** attempt, 10))\n                    continue\n                return\
          \ {\"ok\": False, \"error\": last_error, \"search_results\": []}\n     \
          \       return {\"ok\": True, \"search_results\": result[\"data\"].get(\"\
          results\", []), \"error\": \"\"}\n        except (requests.exceptions.Timeout,\
          \ requests.exceptions.ConnectionError) as e:\n            last_error = f\"\
          attempt {attempt+1}/5: {type(e).__name__}: {e}\"\n            if attempt\
          \ < 4:\n                time.sleep(min(2 ** attempt, 10))\n        except\
          \ Exception as e:\n            return {\"ok\": False, \"error\": f\"{type(e).__name__}:\
          \ {e}\", \"search_results\": []}\n    return {\"ok\": False, \"error\":\
          \ f\"retry 5 times still failed: {last_error}\", \"search_results\": []}"
        code_language: python3
        desc: web_search_batch 4 条合并查询（带重试）
        outputs:
          error:
            children: null
            type: string
          ok:
            children: null
            type: boolean
          search_results:
            children: null
            type: array[object]
