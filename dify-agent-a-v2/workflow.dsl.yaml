        code: "import requests\nimport time\n\ndef main(biz_api_base, geo_api_token):\n\
          \    headers = {\"Authorization\": f\"Bearer {geo_api_token}\"}\n    url\
          \ = f\"{biz_api_base}/api/v1/tools/read_skills_batch\"\n    payload = {\"\
          skills\": [\"overseas-geo-competitor-research\", \"geo-presales-prompt-builder\"\
          ], \"include_shared\": True}\n    last_error = \"\"\n    for attempt in\
          \ range(3):\n        try:\n            resp = requests.post(url, json=payload,\
          \ headers=headers, timeout=30)\n            result = resp.json()\n     \
          \       if not result.get(\"ok\"):\n                return {\"ok\": False,\
          \ \"error\": result.get(\"error\", \"unknown\"), \"skills_count\": 0, \"\
          skills_list\": []}\n            skills = result[\"data\"][\"skills\"]\n\
          \            return {\"ok\": True, \"skills_count\": len(skills), \"skills_list\"\
          : list(skills.keys()), \"error\": \"\"}\n        except (requests.exceptions.Timeout,\
          \ requests.exceptions.ConnectionError) as e:\n            last_error = f\"\
          attempt {attempt+1}/3: {type(e).__name__}: {e}\"\n            if attempt\
          \ < 2:\n                time.sleep(2 ** attempt)\n        except Exception\
          \ as e:\n            return {\"ok\": False, \"error\": f\"{type(e).__name__}:\
          \ {e}\", \"skills_count\": 0, \"skills_list\": []}\n    return {\"ok\":\
          \ False, \"error\": f\"重试 3 次仍失败: {last_error}\", \"skills_count\": 0, \"\
          skills_list\": []}"
        code_language: python3
